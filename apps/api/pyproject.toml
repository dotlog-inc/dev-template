[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.37",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    # NOTE: ruff の select = ["ALL"] は新ルール追加で lint が壊れ得るため互換リリースに固定する
    "ruff>=0.15.4,<0.17.0",
    "pyright>=1.1",
    "pytest>=8.0",
    # starlette 1.3+ の TestClient は httpx2 を優先し、型チェック時は無条件に import する。
    # これが無いと pyright が TestClient 経由の型を全部 Unknown にする
    "httpx2>=2.12.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: PostgreSQL への接続が必要（`docker compose up -d db` を前提とする）",
]
# **既定では db を外す。** DB 無しでも `mise run check` が通る状態を保つ。
# 実行するときは `mise run //apps/api:test:db`（CI は別ステップで流す）。
# addopts はコマンドラインの前に展開されるだけで、同じ引数（-m）は後勝ちになる
addopts = ["-m", "not db"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ---- docstring ----
    "D1",    # docstring 未記述を許容
    "D203",  # D211 と競合するため除外（クラス前空行なし）
    "D212",  # D213 と競合するため除外（要約を2行目に）
    "D400",  # 最初の行をピリオドで終わらせる必要なし
    "D415",  # 最初の行の終端文字を強制しない
    # ---- スタイル ----
    # NOTE: 属性 docstring（フィールド直後の """...."""）は ruff からは実行時文字列に見えるため
    #       RUF002 ではなく RUF001 で拾われる。日本語で意図を書けるよう同じ扱いにする。
    "RUF001", # 属性 docstring 中の全角文字を許容
    "RUF002", # 日本語コメント中の全角文字を許容
    "RUF003", # 日本語コメント中の全角文字を許容
    "COM812", # ruff format と競合するため除外
    "ISC001", # ruff format と競合するため除外
    # ---- ヘッダー ----
    "CPY",   # copyright ヘッダーは運用していない（ruff 0.16 で ALL に入った）
    # ---- TODO / FIXME ----
    "TD",    # TODO の著者・リンク強制を無効化（issue 管理側でトラッキング）
    "FIX",   # TODO/FIXME コメントの存在を警告しない
    "ERA001", # コメントアウトされたコード検出を無効化
    # ---- 型アノテーション ----
    "ANN",   # 型アノテーションは pyright に任せる
    "TC",    # SQLAlchemy の Mapped 型は実行時に解決されるため型専用 import に倒さない
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # テストでの assert を許容
    "PLR2004", # テストでのマジック値を許容
]
"migrations/**/*.py" = [
    "INP001",  # Alembic マイグレーションは名前空間パッケージのため __init__.py 不要
    "D",       # 自動生成されるマイグレーションの docstring 体裁は強制しない
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"              # 最も厳格な型チェック
exclude = ["migrations/versions/", ".venv"]  # 自動生成の versions のみ除外（env.py は型チェック対象に残す）
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportUntypedFunctionDecorator = false   # FastAPI のデコレータに対応
reportUnusedFunction = false             # FastAPI の exception_handler デコレータ等に対応

# apps/web/mise.toml

[tools]
# NOTE: Dockerfile / Dockerfile.dev の node:22-alpine、package.json の engines.node と整合させること
node = "22"
# NOTE: Dockerfile / Dockerfile.dev / package.json の packageManager と整合させること（patch まで固定）
pnpm = "9.15.9"

[tasks.setup]
description = "依存関係のインストールと環境変数の設定"
run = """
  pnpm install
  if [ ! -f .env.local ]; then
    if [ -f .env.example ]; then
      cp .env.example .env.local
      echo "✓ .env.local ファイルを作成しました。"
    fi
  else
    echo "✓ .env.local ファイルは既に存在します。"
  fi
"""

[tasks.dev]
description = "Next.js 開発サーバーを起動"
run = "pnpm dev"

[tasks.build]
description = "プロダクションビルド"
run = "pnpm build"

[tasks.start]
description = "プロダクションサーバーを起動"
depends = [":build"]
run = "pnpm start"

[tasks.lint]
description = "ESLint でコードチェック"
run = "pnpm lint"

[tasks.stylelint]
description = "stylelint で CSS をチェック（!important の禁止）"
# 規則は declaration-no-important 1 つだけ。詳細度負けで宣言が黙って捨てられる罠を
# 機械で止めるのが目的で、一般的な整形の指摘は入れていない
run = "pnpm run stylelint"

[tasks.test]
description = "vitest でユニットテストを実行"
run = "pnpm test"

[tasks.typecheck]
description = "TypeScript の型チェック"
run = "pnpm run typecheck"

[tasks.knip]
description = "未使用のファイル・export・依存を検出"
# NOTE: knip 6 は Node ^20.19 || >=22.12 が必要。[tools] の node = "22" が前提。
run = "pnpm run knip"

[tasks.format]
description = "Prettier でコードをフォーマット"
run = "pnpm run format"

[tasks."format:check"]
description = "Prettier でフォーマットチェック（変更なし）"
run = "pnpm run format:check"

[tasks.check]
alias = "qa"
description = "lint・CSS チェック・型チェック・フォーマットチェック・未使用検出・テストを実行"
depends = [":lint", ":stylelint", ":typecheck", ":format:check", ":knip", ":test"]

[tasks.clean]
description = "ビルド成果物とキャッシュを削除"
run = """
  rm -rf .next
  rm -rf node_modules/.cache
  echo "✓ クリーンアップ完了"
"""

[tasks."clean:all"]
description = "node_modules を含めて完全クリーンアップ"
run = """
  rm -rf .next node_modules
  echo "✓ 完全クリーンアップ完了。mise run setup を実行してください。"
"""

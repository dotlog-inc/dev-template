# 依存関係の更新 PR を週次で自動作成する。
#
# ここが作るのは «更新 PR» のみ。既知脆弱性の検知は
#   - 新規 CVE 公開時 … GitHub の Dependabot alerts（リポジトリ設定。private でも無料）
#   - PR / main の CI … ci.yml の pnpm audit / pip-audit
# の 2 経路が担い、この 3 つで「検知 → 修正 PR → マージでブロック解除」が閉じる。
version: 2
updates:
  # GitHub Actions は SHA ピン運用（ci.yml）。dependabot は SHA とコメントの
  # バージョン表記を対で更新できるため、ピン運用と両立する
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    # major は互換性確認が要るので単独 PR、minor / patch は 1 本にまとめて
    # 「週に十数本の更新 PR」でレビューが破綻するのを防ぐ
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # 型定義の major はランタイム（apps/web/mise.toml / Dockerfile の node 22）に
      # 揃える。先に型だけ上げるとランタイムに無い API が型上通ってしまう。
      # node を 24 以降へ上げるときは、この上限も一緒に上げること
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo

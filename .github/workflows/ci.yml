name: CI

# NOTE: `on:` に paths: フィルタは付けない。
#       ruleset の required status check にした job が「workflow ごと起動しない」状態になると
#       チェックが永久に pending のままマージ不能になるため。
#       差分による出し分けは changes job + 各 job の if: で行う（skip は required check 上 成功扱い）。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR は新しい push で古い run を捨てる。main は履歴を残したいのでキャンセルしない
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter は pull_request では変更ファイル一覧を GitHub API から取るため
    # pull-requests: read が要る。この job だけに与える。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            common: &common
              - '.github/workflows/ci.yml'
              - 'mise.toml'
              - 'scripts/check-env.sh'
            web:
              - *common
              - 'apps/web/**'
            api:
              - *common
              - 'apps/api/**'
            infra:
              - *common
              - 'infra/**'

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # apps/web/mise.toml の [tools]（node 22 / pnpm 9.15.9）をそのまま使う。
      # バージョンの単一ソースは mise.toml 側に置き、workflow では宣言しない。
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: apps/web

      - id: pnpm
        name: pnpm ストアのパスを解決
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - id: pnpm-cache
        name: pnpm ストアをキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Next.js のビルドキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # --frozen-lockfile: package.json と pnpm-lock.yaml のズレを CI で落とす
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      # 既知脆弱性の検知。--prod で本番に載る依存だけを見る。dev 依存は advisory が多く、
      # ここで赤にすると修正不能な警告で PR が止まり続けるため Dependabot alerts に任せる。
      # 修正版が無い CVE を一時的に無視するときは package.json の
      # pnpm.auditConfig.ignoreCves に理由コメント付きで登録する
      - name: 依存関係の脆弱性を監査
        run: pnpm audit --prod

      # tsconfig.json の include にある next-env.d.ts と .next/types/** は .gitignore 済みで
      # クリーンチェックアウトには存在しない。lint / typecheck の前に生成しておく。
      - name: Next.js の型を生成
        run: pnpm exec next typegen

      # 品質チェックのツール別キャッシュ（eslint / prettier / knip は package.json の --cache、
      # tsc は tsconfig の incremental が書く tsbuildinfo）。どれも中身のハッシュで判定するので、
      # checkout で mtime が変わっても効く。キーに sha を入れて毎回最新を保存し、
      # 依存を上げたら使い回さない
      - name: 品質チェックのキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/web/node_modules/.cache/eslint
            apps/web/node_modules/.cache/prettier
            apps/web/node_modules/.cache/knip
            apps/web/tsconfig.tsbuildinfo
          key: web-check-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            web-check-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-

      # //apps/web:check = lint + stylelint + typecheck + format:check + knip + test
      # （ローカルの mise run check と同一）
      - name: 品質チェック
        run: mise run check

      - name: プロダクションビルド
        run: mise run build

      # pnpm ストアは restore-keys で前の版を引き継ぐため、依存を上げるたびに古い版が積み上がる。
      # 新しいキーで保存されるとき（= 完全一致しなかったとき）だけ、いまの node_modules が
      # 参照していない版を落としてから保存させる
      - name: pnpm ストアの不要な版を削除
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: pnpm store prune

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/api
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      # apps/api/.env.example と同じ形にする。ホストとポートだけが違う
      DATABASE_URL: postgresql+psycopg://devtemplate_app:devtemplate_app@localhost:5432/devtemplate
      MIGRATION_DATABASE_URL: postgresql+psycopg://devtemplate_migrator:devtemplate_migrator@localhost:5432/devtemplate
    # マイグレーションは実 Postgres でしか検証できない。compose と同じイメージに固定し、
    # ローカルと CI で挙動を揃える
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # superuser。ロール作成と権限付与にだけ使う。アプリ用の接続には使わない
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devtemplate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devtemplate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # apps/api/mise.toml の [tools]（python / uv）をそのまま使う
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: apps/api

      - name: uv のキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # --locked: uv.lock が pyproject.toml と乖離していたら落とす
      - name: 依存関係をインストール
        run: uv sync --locked

      # 既知脆弱性の検知。uv.lock の全依存を pip-audit で PyPI advisory / OSV に照会する。
      # --disable-pip で「lock の記載をそのまま監査」になり、環境へ何もインストールしない。
      # 修正版が無い CVE を一時的に無視するときは --ignore-vuln <ID> を理由コメント付きで足す
      - name: 依存関係の脆弱性を監査
        run: |
          uv export --locked --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"

      # compose の initdb.d が流すのと同じスクリプトをそのまま使う。CI 用に SQL を書き写すと
      # ロール構成がローカルと静かにずれ、「ローカルでは緑なのに CI だけ落ちる」が起きる
      - name: DB ロールと権限を用意する
        working-directory: .
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: devtemplate
          APP_PASSWORD: devtemplate_app
          MIGRATOR_PASSWORD: devtemplate_migrator
        run: |
          ./infra/sql/local/create-roles.sh
          psql -v ON_ERROR_STOP=1 -U postgres -d devtemplate -f infra/sql/bootstrap-grants.sql

      # 手元と同じコマンドでマイグレーションが通ることを確かめる
      - name: マイグレーションを適用する
        run: mise run db:migrate

      # //apps/api:check = ruff + pyright + pytest（ローカルの mise run check と同一）
      - name: 品質チェック
        run: mise run check

      # ロールの分離が効いていることは実 PostgreSQL でしか検証できない。
      # 既定の pytest からは外してあるので（pyproject の addopts）、ここで別に流す
      - name: DB が要るテスト
        run: mise run test:db

      - name: キャッシュを整理
        run: uv cache prune --ci

  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: infra

      # //infra:check = terraform fmt -check + validate
      - name: Terraform チェック
        run: mise run check

  # 秘密の混入検知。private リポジトリでは GitHub 標準の secret scanning / push protection は
  # 有償（GitHub Secret Protection）でしか使えず、gitleaks がその代わりになる。
  #
  # changes job に通さず常に走らせる。秘密はどのパスにも入りうるため、paths での出し分けが
  # そのまま検知の穴になる。
  #
  # gitleaks-action ではなく CLI を直接叩いている。action は Organization 配下だと
  # GITLEAKS_LICENSE（有償）が要るため。
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # 全履歴を見るので shallow clone では足りない
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ルートの mise.toml の [tools]（gitleaks）を使う。pre-commit と同じ版になる
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # 検出結果は artifact に残さない。秘密の生値を成果物として置き直すことになるため
      # （タスク側で --redact 済み）。どのコミットかはログの fingerprint で追える
      - name: 秘密のスキャン
        run: mise run secrets:scan

  # ruleset の required status check はこの job 1 つだけを指定する。
  # job が増減しても ruleset を触らずに済み、skip / failure の扱いもここで一元化できる。
  ci:
    name: ci
    if: always()
    needs: [changes, web, api, infra, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 失敗・キャンセルされた job がないか確認
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::失敗した job があります"
            exit 1
          fi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  firebase-emulator:
    build:
      context: .
      dockerfile: local/firebase/Dockerfile
    ports:
      - "${FIREBASE_AUTH_EMULATOR_PORT:-9099}:9099"
      - "${FIREBASE_EMULATOR_UI_PORT:-4000}:4000"
    volumes:
      - ./local/firebase/firebase.json:/home/node/firebase.json
      - firebase-emulator-data:/home/node/firebase_export
    stop_grace_period: 15s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-project}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./apps/api:/app
      - api-venv:/opt/venv
    depends_on:
      db:
        condition: service_healthy
      firebase-emulator:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    depends_on:
      - api

volumes:
  postgres-data:
  api-venv:
  web-node-modules:
  web-next:
  firebase-emulator-data:

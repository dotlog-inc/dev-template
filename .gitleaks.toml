# gitleaks の設定。既定ルールをそのまま使い、ここに広い allowlist を置かない。
#
# 誤検知が出たときは、まず .gitleaksignore に fingerprint 単位（commit:path:rule:行番号）で
# 1 件ずつ登録する。ここに paths の allowlist を足すのは「そのパスには定義上ダミーしか
# 置かない」と言い切れる場合だけに限る。パス単位で広く許すと、そこに本物が入ったときに
# 永久に検出できなくなり、この設定ファイルごと骨抜きになる。

# mise.toml の [tools] gitleaks と揃える。フックが PATH 上の古い gitleaks に
# フォールバックしたとき、設定を誤って解釈したまま素通しさせないため
minVersion = "8.30.1"

[extend]
useDefault = true
